<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel — Juliana Design</title><link rel="stylesheet" href="style.css"></head><body class="admin"><div class="login" id="login"><img src="assets/logo.png"><span class="eyebrow">ÁREA PROFISSIONAL</span><h1>Painel Juliana Design</h1><p>Acesso reservado para a proprietária.</p><input id="email" type="email" placeholder="E-mail"><input id="pass" type="password" placeholder="Senha"><button class="btn primary full" id="go">Entrar</button><small>Demonstração: o login real será conectado ao backend seguro.</small><a href="index.html">← Voltar ao site</a></div><div class="dashboard" id="dash" hidden><h1>Agenda de hoje</h1><div id="list"></div><button class="btn ghost" id="out">Sair</button></div><script>const l=document.getElementById('login'),d=document.getElementById('dash');document.getElementById('go').onclick=()=>{if(email.value&&pass.value){l.hidden=true;d.hidden=false;render()}else alert('Digite e-mail e senha.')};document.getElementById('out').onclick=()=>{d.hidden=true;l.hidden=false};function render(){const k='julianaBookings_'+new Date().toISOString().slice(0,10),a=JSON.parse(localStorage.getItem(k)||'[]');list.innerHTML=a.length?a.map(x=>`<div class="appt"><b>${x.time} — ${x.name}</b><br>${x.service}<br>WhatsApp: ${x.phone}</div>`).join(''):'<p>Nenhum agendamento salvo neste navegador.</p>'}</script></body></html>
